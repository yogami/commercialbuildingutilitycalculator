[project]
name = "commercialbuildingutilitycalculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yami Gopal", email = "yogami@berlinailabs.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
commercialbuildingutilitycalculator = "commercialbuildingutilitycalculator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
